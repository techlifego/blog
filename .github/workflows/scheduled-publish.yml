# 예약 발행: 매시간 확인해서, 발행 시각이 지났는데 사이트에 없는 글이 있을 때만 Cloudflare Pages를 다시 배포한다.
# 필요한 것: 저장소 Settings → Secrets and variables → Actions 에 CF_DEPLOY_HOOK (Cloudflare Pages 배포 훅 주소)
name: scheduled-publish

on:
  schedule:
    - cron: '7 * * * *'   # 매시 7분 (UTC 기준, GitHub 사정으로 몇 분~몇십 분 늦을 수 있음)
  workflow_dispatch:       # Actions 화면에서 손으로 실행

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: check
        run: node scripts/due-posts.mjs
      - name: Cloudflare 다시 배포
        if: steps.check.outputs.due == 'true' || github.event_name == 'workflow_dispatch'
        env:
          HOOK: ${{ secrets.CF_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "::warning::CF_DEPLOY_HOOK 비밀값이 없습니다. OPERATIONS.md 참고"; exit 0; fi
          curl -fsS -X POST "$HOOK" > /dev/null && echo "배포 요청 보냄"
